name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate model resources
        run: python -m tools.prepare_pagani_model --verify-only
      - name: python checks
        run: |
          python -m py_compile tools/assetto_corsa_sender.py tools/prepare_pagani_model.py tools/check_packaged_jar.py tests/python/test_assetto_corsa_sender.py
          python -m unittest discover -s tests/python -v
      - name: compile, test, and build
        run: ./gradlew compileJava compileClientJava test build
      - name: validate packaged jar
        run: python tools/check_packaged_jar.py
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GodWarBridge-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
